site_name: Jubilee Powder Documentation
site_description: Documentation for the Jubilee automation platform
site_author: Bennett Lahn
repo_url: https://github.com/bennett-lahn/jubilee-powder
repo_name: jubilee-powder

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
            - frontend
            - frontend/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            separate_signature: true
            merge_init_into_class: true
            show_if_no_docstring: false
            members_order: source
            group_by_category: true
            show_category_heading: true
            docstring_section_style: spacy
            show_bases: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/overview.md
    - Quick Start: getting-started/quickstart.md
  - Concepts:
    - Architecture: concepts/architecture.md
    - Best Practices: concepts/best-practices.md
    - Glossary: concepts/glossary.md
  - How-To Guides:
    - Setup:
      - Configuration: how-to/configuration.md
      - Building and Running: how-to/running.md
    - Operate:
      - Using the Automation UI: how-to/using-gui.md
      - Using the Jubilee Web Interfaces: how-to/web-ui.md
      - Interpreting Results: how-to/results.md
    - Maintain:
      - Reading LCD Displays: how-to/reading-lcd-displays.md
    - Extend:
      - Running on New Data: how-to/run-new-data.md
  - API Reference:
    - Core:
      - JubileeManager: api/jubilee-manager.md
      - MotionPlatformStateMachine: api/motion-platform.md
      - Position Configuration: api/position-config.md
      - Manipulator: api/manipulator.md
      - PistonDispenser: api/piston-dispenser.md
      - Scale: api/scale.md
      - HardnessTester: api/hardness-tester.md
      - ConfigLoader: api/config-loader.md
    - Frontend:
      - Web Application: api/gui/jubilee-gui.md
      - Jubilee Store: api/gui/jubilee-view-model.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bennett-lahn/jubilee-powder
