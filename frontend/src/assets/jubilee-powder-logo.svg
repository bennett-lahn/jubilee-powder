<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jubilee Powder logo">
  <!-- Outer circular border (transparent interior) -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#fbbf24" stroke-width="3.5" />

  <!-- Geometric lowercase "jp" monogram -->
  <g stroke="#fbbf24" stroke-width="4" stroke-linecap="butt" fill="none">
    <!-- j: straight stem with clean quarter-circle hook -->
    <path d="M26 22 v17 a7 7 0 0 1 -7 7" />
    <!-- p: descending stem -->
    <path d="M37 22 v27" />
    <!-- p: circular bowl -->
    <path d="M37 24 a8 8 0 1 1 0 16" />
  </g>

  <!-- j: dot -->
  <circle cx="26" cy="15" r="2.5" fill="#fbbf24" />
</svg>
